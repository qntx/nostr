[package]
name         = "qntx-nostr-interop"
publish      = false
description  = "Shared-vector and differential-stream runner: executes the JSON cases under vectors/ against rust-nostr's public API."
version      = "0.0.0"
edition      = "2024"
rust-version = "1.99"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/qntx/nostr"
homepage     = "https://github.com/qntx/nostr"
authors      = ["QNTX <https://qntx.org>"]

[dev-dependencies]
base64     = "0.22"
nostr      = { version = "0.45.5", default-features = false, features = ["std", "os-rng", "nip04", "nip44", "nip46", "nip49", "nip59", "nip98"] }
proptest   = "1.11"
secp256k1  = "0.30"
serde      = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc", "std"] }
sha2       = { version = "0.11", default-features = false }
url        = "2.5"

[lints.rust]
rust_2018_idioms        = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
unused_must_use         = "deny"
unused_qualifications   = "warn"
non_ascii_idents        = "deny"
unsafe_code             = "forbid"

[lints.clippy]
correctness                     = { level = "deny", priority = -1 }
suspicious                      = { level = "deny", priority = -1 }
complexity                      = { level = "warn", priority = -1 }
perf                            = { level = "warn", priority = -1 }
style                           = { level = "warn", priority = -1 }
pedantic                        = { level = "warn", priority = -1 }
dbg_macro                       = "warn"
todo                            = "warn"
allow_attributes_without_reason = "warn"

[profile.test]
opt-level = 2
