[package]
name                   = "nk-wasm"
publish                = false
description            = "libsecp256k1 BIP-340 verify plus SHA-256 event-id check, compiled to wasm32-unknown-unknown."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
secp256k1    = { workspace = true, features = ["global-context", "lowmemory"] }
sha2         = { workspace = true }
wasm-bindgen = { workspace = true }

[lints]
workspace = true
