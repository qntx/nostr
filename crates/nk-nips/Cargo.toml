[package]
name                   = "nk-nips"
description            = "Platform-neutral NIP implementations for the nk-* workspace. Rust counterpart of @qntx/nostr's nips layer."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
documentation          = "https://docs.rs/nk-nips"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "clock", "os-rng"]
std     = ["nk-core/std"]
clock   = ["std", "nk-core/clock"]
# os-rng owns the optional getrandom so NIP modules (nip44::encrypt) can draw
# nonces; portable --no-default-features builds never see it.
os-rng = ["std", "nk-core/os-rng", "dep:getrandom"]
nip04  = ["dep:aes", "dep:base64ct", "dep:cbc", "dep:rand_core", "dep:secp256k1", "dep:zeroize"]
nip10  = ["nip19"]
nip13  = ["dep:sha2"]
nip19  = ["dep:bech32", "dep:zeroize"]
nip21  = ["nip19"]
nip42  = []
nip44  = ["dep:base64ct", "dep:chacha20", "dep:hkdf", "dep:hmac", "dep:rand_core", "dep:secp256k1", "dep:sha2", "dep:zeroize"]
nip49  = ["nip19", "dep:chacha20poly1305", "dep:rand_core", "dep:scrypt", "dep:unicode-normalization", "dep:zeroize"]
nip51  = ["nip44", "dep:serde_json"]
nip17  = ["nip59"]
nip59  = ["nip44", "dep:rand_core", "dep:serde_json"]
nip65  = []
nip98  = ["dep:base64ct", "dep:serde_json", "dep:sha2"]

# Rule: every external dependency is optional and enabled by the NIP
# features that use it, so --no-default-features pulls nothing beyond
# nk-core.
[dependencies]
aes                   = { workspace = true, optional = true }
base64ct              = { workspace = true, optional = true }
bech32                = { workspace = true, optional = true }
cbc                   = { workspace = true, optional = true, features = ["block-padding"] }
chacha20              = { workspace = true, optional = true, features = ["cipher"] }
chacha20poly1305      = { workspace = true, optional = true }
getrandom             = { workspace = true, optional = true, features = ["sys_rng"] }
hkdf                  = { workspace = true, optional = true }
hmac                  = { workspace = true, optional = true }
nk-core               = { workspace = true }
rand_core             = { workspace = true, optional = true }
scrypt                = { workspace = true, optional = true }
secp256k1             = { workspace = true, optional = true }
serde_json            = { workspace = true, optional = true, features = ["float_roundtrip"] }
sha2                  = { workspace = true, optional = true }
unicode-normalization = { workspace = true, optional = true }
zeroize               = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }

[[bench]]
name              = "pow"
harness           = false
required-features = ["nip13"]

[lints]
workspace = true
