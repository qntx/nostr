[package]
name                   = "nk-vectors"
publish                = false
description            = "Shared-vector runner: executes the JSON cases under vectors/ against the nk-* public APIs."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[dev-dependencies]
nk-core    = { workspace = true }
nk-nips    = { workspace = true, features = ["nip04", "nip13", "nip19", "nip21", "nip42", "nip44", "nip49", "nip98"] }
proptest   = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
sha2       = { workspace = true }

[lints]
workspace = true
