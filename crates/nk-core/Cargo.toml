[package]
name                   = "nk-core"
publish                = false
description            = "Platform-neutral nostr core: errors, limits, timestamps, relay URL normalization, keys, events, filters, and messages. Rust counterpart of @qntx/nostr's core layer."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[features]
default = ["std", "clock"]
std     = ["url/std", "serde/std"]
clock   = ["std"]

[dependencies]
base16ct = { workspace = true }
serde    = { workspace = true }
url      = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
