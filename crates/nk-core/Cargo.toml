[package]
name                   = "nk-core"
publish                = false
description            = "Platform-neutral nostr core: errors, limits, timestamps, relay URL normalization, keys, events, filters, and messages. Rust counterpart of @qntx/nostr's core layer."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[features]
default = ["std", "clock", "os-rng"]
std     = ["url/std", "serde/std", "serde_json/std", "secp256k1/std", "secp256k1/global-context"]
clock   = ["std"]
os-rng  = ["std", "dep:getrandom"]

[dependencies]
base16ct   = { workspace = true }
getrandom  = { workspace = true, optional = true, features = ["sys_rng"] }
rand_core  = { workspace = true }
secp256k1  = { workspace = true, features = ["alloc"] }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
url        = { workspace = true }
zeroize    = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }

[[bench]]
name    = "verify"
harness = false

[[bench]]
name    = "deserialize"
harness = false

[lints]
workspace = true
