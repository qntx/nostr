[package]
name = "nostr-crypto-wasm"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"
description = "libsecp256k1 BIP-340 verify plus SHA-256 event-id check, compiled to wasm32-unknown-unknown."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
secp256k1 = { version = "0.31.1", default-features = false, features = [
  "std",
  "global-context",
  "lowmemory",
] }
sha2 = "0.11"
wasm-bindgen = "=0.2.122"

[lints]
workspace = true
