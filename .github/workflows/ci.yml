name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: qntx/workflows/.github/workflows/ci-bun.yml@v2
    permissions:
      contents: read
    # bun run build → vp run -r build (no Rust)
    # bun run test → vp run -r test + repo-level scripts/*.test.ts

  wasm:
    uses: qntx/workflows/.github/workflows/ci-wasm.yml@v2
    permissions:
      contents: read
    with:
      language: c
      rust-checks: false
      package-manager: bun
      working-directory: packages/nostr-wasm
      install-directory: .
      dist-export: .
      bench: true
      # test:parity replays the differential streams through crates/interop;
      # rustup on the runner picks up rust-toolchain.toml on demand.
      scripts: test:parity
      scripts-directory: .

  rust:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      # rust-version omitted: crates/interop/rust-toolchain.toml pins it.
      working-directory: crates/interop
      deny: true
      doc: true
