name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: qntx/workflows/.github/workflows/ci-bun.yml@v2
    permissions:
      contents: read
    # bun run build → vp run -r build (no Rust)
    # bun run test → vp run -r test + repo-level scripts/*.test.ts

  wasm:
    uses: qntx/workflows/.github/workflows/ci-wasm.yml@v2
    permissions:
      contents: read
    with:
      language: c
      rust-checks: false
      package-manager: bun
      working-directory: packages/nostr-wasm
      install-directory: .
      dist-export: .
      bench: true
      # test:parity replays the differential streams through crates/nk-core;
      # rustup on the runner picks up rust-toolchain.toml on demand.
      scripts: test:parity
      scripts-directory: .

  # nostr_wasm.wasm and its SRI integrity hash are committed artifacts: rebuild
  # inside the pinned linux/amd64 image and diff, so the checked-in bytes always
  # come from the pinned toolchain (scripts/Dockerfile — same model as
  # @qntx/spark-wasm).
  wasm-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/nostr-wasm build:wasm
      - run: git diff --exit-code packages/nostr-wasm/src/nostr_wasm.wasm
          packages/nostr-wasm/src/integrity.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nostr-wasm-rebuild
          path: packages/nostr-wasm/src/nostr_wasm.wasm

  rust:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      # rust-version omitted: rust-toolchain.toml pins it.
      deny: true
      doc: true
      package-check: true
      each-feature: true
      packages: nk nk-core nk-store

  rust-minimal:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      packages: nk nk-core nk-store
      features: --no-default-features

  # nk-store with rusqlite bundled: the C SQLite sources must build for the
  # mobile targets. --all-features enables `sqlite`.
  portable-store:
    uses: qntx/workflows/.github/workflows/ci-rust-cross.yml@v2
    permissions:
      contents: read
    with:
      targets: aarch64-linux-android x86_64-linux-android aarch64-apple-ios aarch64-apple-ios-sim
      packages: nk-store
      features: --all-features
      forbid-deps: tokio

  # secp256k1-sys compiles C on every target; ci-rust-cross supplies the
  # wasm clang, Android NDK and iOS SDK toolchains.
  portable:
    uses: qntx/workflows/.github/workflows/ci-rust-cross.yml@v2
    permissions:
      contents: read
    with:
      targets: wasm32-unknown-unknown aarch64-linux-android armv7-linux-androideabi x86_64-linux-android aarch64-apple-ios aarch64-apple-ios-sim
      packages: nk-core
      features: --no-default-features
      forbid-deps: getrandom tokio

  # Runs the nk E2E suite against a pinned nosfry release binary.
  e2e:
    name: e2e (nosfry)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: crates/nk/tests/e2e/run.sh
