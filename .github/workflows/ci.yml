name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: qntx/workflows/.github/workflows/ci-bun.yml@v2
    permissions:
      contents: read
    # bun run build → vp run -r build (no Rust)
    # bun run test → vp run -r test + repo-level scripts/*.test.ts

  wasm:
    uses: qntx/workflows/.github/workflows/ci-wasm.yml@v2
    permissions:
      contents: read
    with:
      package-manager: bun
      # The workspace root owns Cargo.lock and node_modules.
      working-directory: packages/nostr-wasm
      install-directory: .
      cargo-directory: .
      dist-export: .
      bench: true
      # Rust gates live in the rust/rust-minimal jobs.
      rust-checks: false
      # NK1-08 differential replay: generator runs under bun, the nk-vectors
      # diff test replays it through cargo. Runs at the workspace root.
      scripts: test:parity
      scripts-directory: .

  rust:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      # rust-version omitted: rust-toolchain.toml pins the toolchain.
      deny: true

  rust-minimal:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      features: --no-default-features
      doc: true
      # Per-package -p runs: Cargo feature unification across members must
      # not mask the minimal configuration. Extend the list per new crate.
      packages: nk nk-vectors nk-wasm
      package-check: true
      each-feature: true

  portable:
    uses: qntx/workflows/.github/workflows/ci-rust-cross.yml@v2
    permissions:
      contents: read
    with:
      targets: wasm32-unknown-unknown aarch64-linux-android x86_64-linux-android aarch64-apple-ios aarch64-apple-ios-sim
      packages: nk-wasm nk
      features: --no-default-features
      forbid-deps: getrandom

  # nk's default set (std, clock, os-rng) spelled out: the reusable
  # workflow accepts no empty features value, and --all-features would pick
  # up any future non-default feature instead of tracking the default set.
  portable-std:
    uses: qntx/workflows/.github/workflows/ci-rust-cross.yml@v2
    permissions:
      contents: read
    with:
      targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android aarch64-apple-ios aarch64-apple-ios-sim
      packages: nk
      features: --features std,clock,os-rng

  # nk without std: same P-level targets as `portable`, only the NIP
  # features enabled so the no_std+alloc configuration is what gets checked.
  portable-nips:
    uses: qntx/workflows/.github/workflows/ci-rust-cross.yml@v2
    permissions:
      contents: read
    with:
      targets: wasm32-unknown-unknown aarch64-linux-android x86_64-linux-android aarch64-apple-ios aarch64-apple-ios-sim
      packages: nk
      features: --no-default-features --features nip04,nip10,nip13,nip17,nip19,nip21,nip27,nip42,nip44,nip46,nip49,nip51,nip57,nip59,nip65,nip98
      forbid-deps: getrandom

  # nk's default set (std, clock, os-rng) plus the NIP features on the
  # portable-std targets; a separate job because cross calls cannot mix
  # per-package features.
  portable-std-nips:
    uses: qntx/workflows/.github/workflows/ci-rust-cross.yml@v2
    permissions:
      contents: read
    with:
      targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android aarch64-apple-ios aarch64-apple-ios-sim
      packages: nk
      features: --features std,clock,os-rng,nip04,nip10,nip13,nip17,nip19,nip21,nip27,nip42,nip44,nip46,nip49,nip51,nip57,nip59,nip65,nip98
