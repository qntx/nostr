name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: qntx/workflows/.github/workflows/ci-bun.yml@v2
    permissions:
      contents: read
    # bun run build → vp run -r build (no Rust)
    # bun run test → vp run -r test + repo-level scripts/*.test.ts

  wasm:
    # Local reusable workflow: ci-wasm@v2 requires a Rust cdylib in the
    # workspace, which no longer exists (the artifact is built with clang).
    uses: ./.github/workflows/ci-wasm.yml
    permissions:
      contents: read
    with:
      working-directory: packages/nostr-wasm
      bench: true

  rust:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      # rust-version omitted: rust-toolchain.toml pins the toolchain.
      deny: true

  rust-minimal:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      features: --no-default-features
      doc: true
      # Per-package -p runs: Cargo feature unification across members must
      # not mask the minimal configuration.
      packages: qntx-nostr-interop
