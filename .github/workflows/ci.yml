name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: qntx/workflows/.github/workflows/ci-bun.yml@v2
    permissions:
      contents: read
    # bun run build → vp run -r build (no Rust)
    # bun run test → vp run -r test + repo-level scripts/*.test.ts

  wasm:
    uses: qntx/workflows/.github/workflows/ci-wasm.yml@v2
    permissions:
      contents: read
    with:
      language: c
      rust-checks: false
      package-manager: bun
      working-directory: packages/nostr-wasm
      install-directory: .
      dist-export: .
      bench: true
      # test:parity replays the differential streams through crates/nk-core;
      # rustup on the runner picks up rust-toolchain.toml on demand.
      scripts: test:parity
      scripts-directory: .

  rust:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      # rust-version omitted: rust-toolchain.toml pins it.
      deny: true
      doc: true
      package-check: true
      each-feature: true
      packages: nk-core

  rust-minimal:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      packages: nk-core
      features: --no-default-features

  # secp256k1-sys compiles C on every target; ci-rust-cross supplies the
  # wasm clang, Android NDK and iOS SDK toolchains.
  portable:
    uses: qntx/workflows/.github/workflows/ci-rust-cross.yml@v2
    permissions:
      contents: read
    with:
      targets: wasm32-unknown-unknown aarch64-linux-android armv7-linux-androideabi x86_64-linux-android aarch64-apple-ios aarch64-apple-ios-sim
      packages: nk-core
      features: --no-default-features
      forbid-deps: getrandom tokio
