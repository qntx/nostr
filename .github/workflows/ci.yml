name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: qntx/workflows/.github/workflows/ci-bun.yml@v2
    permissions:
      contents: read
    # bun run build → vp run -r build (no Rust)
    # bun run test → vp run -r test + repo-level scripts/*.test.ts

  wasm:
    uses: qntx/workflows/.github/workflows/ci-wasm.yml@v2
    permissions:
      contents: read
    with:
      package-manager: bun
      # The workspace root owns Cargo.lock and node_modules.
      working-directory: packages/nostr-wasm
      install-directory: .
      cargo-directory: .
      dist-export: .
      bench: true
      # Rust gates live in the rust/rust-minimal jobs.
      rust-checks: false
      # Differential replay: the generator runs under bun, the interop diff
      # test replays it through cargo. Runs at the workspace root.
      scripts: test:parity
      scripts-directory: .

  rust:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      # rust-version omitted: rust-toolchain.toml pins the toolchain.
      deny: true

  rust-minimal:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      features: --no-default-features
      doc: true
      # Per-package -p runs: Cargo feature unification across members must
      # not mask the minimal configuration.
      packages: qntx-nostr-wasm qntx-nostr-interop

  portable:
    uses: qntx/workflows/.github/workflows/ci-rust-cross.yml@v2
    permissions:
      contents: read
    with:
      targets: wasm32-unknown-unknown
      packages: qntx-nostr-wasm
      features: --no-default-features
      forbid-deps: getrandom
