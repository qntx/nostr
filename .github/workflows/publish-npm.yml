# Caller owns on:. Pin at @v2.
# OIDC. Do not pass NPM_TOKEN. Do not set environment, runs-on, or steps.
# Required check-runs on a tag: nostr / publish, nostr-wasm / publish and
# nostr-native / publish.
name: Publish

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write

jobs:
  nostr:
    uses: qntx/workflows/.github/workflows/publish-npm.yml@v2
    permissions:
      contents: read
      id-token: write
    with:
      package-manager: bun
      working-directory: packages/nostr

  nostr-native:
    uses: qntx/workflows/.github/workflows/publish-npm.yml@v2
    permissions:
      contents: read
      id-token: write
    with:
      package-manager: bun
      working-directory: packages/nostr-native

  # The checked-in nostr_wasm.wasm (and its SRI integrity hash) is what publish
  # ships: rebuild it in the pinned linux/amd64 image and byte-compare, the
  # same check the CI wasm-artifacts job runs, so a tag can never publish a
  # module the toolchain did not produce.
  wasm-reproducibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/nostr-wasm build:wasm
      - run: git diff --exit-code packages/nostr-wasm/src/nostr_wasm.wasm
          packages/nostr-wasm/src/integrity.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nostr-wasm-rebuild
          path: packages/nostr-wasm/src/nostr_wasm.wasm

  nostr-wasm:
    uses: qntx/workflows/.github/workflows/publish-npm.yml@v2
    permissions:
      contents: read
      id-token: write
    with:
      package-manager: bun
      wasm: true
      language: c
      dist-export: .
      working-directory: packages/nostr-wasm
      timeout-minutes: 30
