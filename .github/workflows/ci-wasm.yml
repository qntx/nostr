# Local replacement for qntx/workflows ci-wasm: the wasm artifact is now built
# from the shared libsecp256k1 C core with clang (no Rust cdylib exists in this
# workspace, which setup-wasm requires). Keeps the "wasm / ci" check name.
name: CI / WASM

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        type: number
        default: 30
      working-directory:
        type: string
        default: "packages/nostr-wasm"
      bench:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      CC_wasm32_unknown_unknown: clang
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v6.0.1
        with:
          persist-credentials: false

      - name: Install clang/lld
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build wasm
        working-directory: ${{ inputs.working-directory }}
        run: bun run build:wasm

      - name: Test wasm
        working-directory: ${{ inputs.working-directory }}
        run: bun run test:wasm

      - name: Bench wasm
        if: ${{ inputs.bench }}
        working-directory: ${{ inputs.working-directory }}
        run: bun run bench:wasm

      - name: Differential parity
        # Rust is installed on demand by rustup from rust-toolchain.toml;
        # the cargo half replays the TS streams through crates/interop.
        run: bun run test:parity
