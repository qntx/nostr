# Caller owns on:. Pin at @v2.
# Required check-run on a tag: nk-core / publish.
name: Publish Crates

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  nk-core:
    uses: qntx/workflows/.github/workflows/publish-crates.yml@v2
    permissions:
      contents: read
    with:
      packages: nk-core
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
