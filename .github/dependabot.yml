version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # >=8 ships sources Hermes cannot parse (tests/hermes/globals.ts).
      - dependency-name: "whatwg-url"
        versions: [">=8"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Pinned to the wasm-bindgen CLI checked by scripts/build-wasm.sh until the
      # nk-wasm byte ABI drops wasm-bindgen.
      - dependency-name: "wasm-bindgen"
