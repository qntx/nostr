[toolchain]
# Pin to the workspace MSRV (edition 2024). Bumping this requires
# updating rust-version under [workspace.package] in Cargo.toml.
channel    = "1.94"
components = ["rustfmt", "clippy"]
targets    = ["wasm32-unknown-unknown", "aarch64-apple-ios", "aarch64-apple-ios-sim", "aarch64-linux-android", "x86_64-linux-android"]
profile    = "minimal"
